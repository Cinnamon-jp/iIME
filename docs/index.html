<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iIME - オンラインデモ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">iIME デモ</h1>
      <p class="subtitle">ローマ字を入力するとリアルタイムにひらがな・漢字に変換されます</p>
    </header>

    <main class="demo-section">
      <div class="input-group">
        <label for="search-input" class="input-label">入力フィールド</label>
        <input 
          type="text" 
          id="search-input" 
          name="q" 
          class="demo-input" 
          placeholder="ローマ字を入力してください（例: kanji, nihongo, arigatou）"
          autocomplete="off"
          autofocus
        >
      </div>

      <div class="input-group">
        <label for="demo-textarea" class="input-label">複数行テキストエリア</label>
        <textarea 
          id="demo-textarea" 
          name="q" 
          class="demo-textarea" 
          rows="4" 
          placeholder="文章を入力してください（例: kyouha iitenki desune.）"
        ></textarea>
      </div>

      <div class="guide-card">
        <h3>💡 操作方法</h3>
        <ul>
          <li><strong>文字入力</strong>: アルファベットを入力するとリアルタイムでひらがな変換</li>
          <li><strong>自動漢字変換</strong>: 入力後、自動で最適な漢字に変換</li>
          <li><strong>Tab キー</strong>: 別の漢字変換候補に切り替え</li>
          <li><strong>Space キー</strong>: 確定・英単語モード切り替え</li>
          <li><strong>Shift + アルファベット</strong>: 大文字英単語モード</li>
        </ul>
      </div>
    </main>
  </div>

  <!-- iIME Core Scripts -->
  <script src="js/inputBasicKeys.js"></script>
  <script src="js/inputBackspace.js"></script>
  <script src="js/dictionary.js"></script>
  <script src="js/encodeText.js"></script>
  <script src="js/style.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
