<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iIME - オンラインデモ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="container">
    <div id="committed-toast" class="committed-toast" aria-live="polite"></div>
    <header class="header">
      <h1 class="title">iIMEデモページ</h1>
      <p class="subtitle">例文：我々は宇宙人だ</p>
    </header>

    <main class="demo-section">
      <div class="demo-grid">
        <!-- iIME あり -->
        <div class="input-card">
          <div class="card-header">
            <span class="card-badge badge-active">iIME あり</span>
            <span class="card-desc">自動かな漢字変換</span>
          </div>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="search-input" 
              name="q" 
              class="demo-input ime-enabled" 
              placeholder="半角ローマ字を入力"
              autocomplete="off"
              autofocus
            >
          </div>
          <div class="hint-container">
            <span class="hint-item"><kbd>Tab</kbd> 候補切替</span>
            <span class="hint-divider">•</span>
            <span class="hint-item"><kbd>Space</kbd> 変換確定</span>
            <span class="hint-divider">•</span>
            <span class="hint-item"><kbd>Enter</kbd> 確定</span>
          </div>
        </div>

        <!-- iIME なし -->
        <div class="input-card">
          <div class="card-header">
            <span class="card-badge badge-normal">iIME なし</span>
            <span class="card-desc">普通のテキスト入力</span>
          </div>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="normal-input" 
              name="q_normal" 
              class="demo-input" 
              placeholder="通常のテキストを入力"
              autocomplete="off"
            >
          </div>
          <div class="hint-container">
            <span class="hint-item"><kbd>Enter</kbd> 確定</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- iIME Core Scripts -->
  <script src="js/inputBasicKeys.js"></script>
  <script src="js/inputSpace.js"></script>
  <script src="js/dictionary.js"></script>
  <script src="js/encodeText.js"></script>
  <script src="js/style.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
