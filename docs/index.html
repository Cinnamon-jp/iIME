<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iIME - オンラインデモ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">iIME</h1>
      <p class="subtitle">ローマ字をリアルタイムにひらがな・漢字へ変換します</p>
    </header>

    <main class="demo-section">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="search-input" 
          name="q" 
          class="demo-input" 
          placeholder="ローマ字を入力（例: kanji, nihongo, arigatou）"
          autocomplete="off"
          autofocus
        >
      </div>
      <div class="hint-container">
        <span class="hint-item"><kbd>Tab</kbd> 候補切替</span>
        <span class="hint-divider">•</span>
        <span class="hint-item"><kbd>Space</kbd> 変換を確定</span>
        <span class="hint-divider">•</span>
        <span class="hint-item"><kbd>Enter</kbd> 文字列を確定</span>
      </div>
    </main>
  </div>

  <!-- iIME Core Scripts -->
  <script src="js/inputBasicKeys.js"></script>
  <script src="js/inputSpace.js"></script>
  <script src="js/dictionary.js"></script>
  <script src="js/encodeText.js"></script>
  <script src="js/style.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
